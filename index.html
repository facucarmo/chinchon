<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#22402F" />
<title>Chinchón · Tanteador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chinchón">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#24462F; --felt-deep:#1B3624; --felt-line:rgba(255,255,255,.06);
    --naipe:#F4ECD6; --naipe-edge:#E1D3AE; --naipe-shadow:rgba(20,38,26,.45);
    --ink:#2A2014; --ink-soft:#7A6B4E;
    --oro:#C2902B; --copa:#B23A2C; --espada:#316487; --basto:#4E7A38;
    --cream:#F0E9D6; --cream-soft:#B9C7B2; --cream-dim:#8FA288;
    --danger:#D2603F; --gold:#E7B948;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    color:var(--cream);
    min-height:100dvh;
    background:
      radial-gradient(120% 80% at 50% -10%, #2E5439 0%, var(--felt) 42%, var(--felt-deep) 100%);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* faint felt weave */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      repeating-linear-gradient(45deg, var(--felt-line) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(-45deg, var(--felt-line) 0 1px, transparent 1px 5px);
    mix-blend-mode:overlay;
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 120px;position:relative}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
  .brand h1{
    font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(34px,11vw,46px);
    line-height:.92;margin:0;letter-spacing:-.5px;color:var(--cream);
  }
  .brand .sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-dim);margin-top:7px;font-weight:600}
  .suits-row{display:flex;gap:6px;margin-bottom:6px}
  .suits-row svg{width:18px;height:18px;opacity:.9}

  /* ---------- generic ---------- */
  .panel{
    background:linear-gradient(180deg, var(--naipe) 0%, #EFE6CD 100%);
    color:var(--ink);border-radius:var(--r);
    border:1px solid var(--naipe-edge);
    box-shadow:0 14px 30px -16px var(--naipe-shadow), inset 0 1px 0 rgba(255,255,255,.6);
    padding:18px;
  }
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:13px;font-weight:600;font-size:16px;padding:14px 18px;
    transition:transform .12s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--ink);color:var(--naipe);width:100%}
  .btn-primary:active{filter:brightness(1.15)}
  .btn-gold{background:linear-gradient(180deg,#E7B948,#C2902B);color:#3a2c08;width:100%}
  .btn-ghost{background:rgba(42,32,20,.07);color:var(--ink)}
  .btn-line{background:transparent;border:1.5px solid rgba(42,32,20,.25);color:var(--ink)}
  input{font-family:inherit}
  input[type=text],input[type=number]{
    background:#fff;border:1.5px solid var(--naipe-edge);border-radius:12px;
    padding:13px 14px;font-size:16px;color:var(--ink);width:100%;outline:none;
  }
  input:focus{border-color:var(--oro)}
  input::placeholder{color:#B7A887}

  /* ---------- setup ---------- */
  .stack{display:flex;flex-direction:column;gap:14px}
  .player-rows{display:flex;flex-direction:column;gap:10px;margin:4px 0}
  .prow{display:flex;align-items:center;gap:10px}
  .prow .pip{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:rgba(42,32,20,.06)}
  .prow .pip svg{width:21px;height:21px}
  .prow input{flex:1}
  .prow .rm{flex:none;width:40px;height:40px;border-radius:11px;font-size:20px;color:var(--ink-soft);background:rgba(42,32,20,.06)}
  .add-btn{width:100%;padding:13px;border-radius:13px;border:1.5px dashed rgba(42,32,20,.3);
    color:var(--ink-soft);font-weight:600;background:transparent;font-size:15px}
  .limit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{padding:9px 15px;border-radius:11px;background:rgba(42,32,20,.06);font-weight:600;font-size:15px;color:var(--ink);border:1.5px solid transparent}
  .chip.on{background:var(--ink);color:var(--naipe)}

  /* ---------- play: scoreboard cards ---------- */
  .deal{display:flex;flex-direction:column;gap:12px}
  .card{
    position:relative;display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,var(--naipe),#EDE3C8);
    border:1px solid var(--naipe-edge);border-radius:16px;padding:14px 16px;
    color:var(--ink);overflow:hidden;
    box-shadow:0 12px 24px -16px var(--naipe-shadow), inset 0 1px 0 rgba(255,255,255,.55);
    animation:deal .4s cubic-bezier(.2,.9,.3,1.2) backwards;
  }
  @keyframes deal{from{opacity:0;transform:translateY(10px) rotate(-1deg) scale(.97)}}
  .card.lead{box-shadow:0 0 0 2px var(--gold), 0 14px 26px -14px rgba(180,140,30,.6)}
  .card.out{filter:grayscale(.55);opacity:.62}
  .card.out::after{
    content:"FUERA";position:absolute;right:-26px;top:14px;transform:rotate(38deg);
    background:var(--danger);color:#fff;font-size:11px;font-weight:800;letter-spacing:.15em;
    padding:4px 32px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .pip-big{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:13px;background:rgba(42,32,20,.05)}
  .pip-big svg{width:32px;height:32px}
  .who{flex:1;min-width:0}
  .who .name{font-weight:700;font-size:17px;line-height:1.1;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .who .crown{font-size:13px}
  .who .bar{height:7px;border-radius:99px;background:rgba(42,32,20,.1);margin-top:8px;overflow:hidden}
  .who .bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.3,.9,.3,1)}
  .who .meta{font-size:11.5px;color:var(--ink-soft);margin-top:5px;font-weight:600;display:flex;gap:8px;align-items:center}
  .badge-re{background:rgba(78,122,56,.16);color:var(--basto);padding:2px 7px;border-radius:6px;font-size:10px;letter-spacing:.04em}
  .score{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:40px;line-height:1;
    text-align:right;min-width:62px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .score small{display:block;font-family:"Inter";font-size:10px;letter-spacing:.14em;color:var(--ink-soft);font-weight:700;margin-top:3px}

  .toolbar{display:flex;gap:10px;margin-top:18px}
  .toolbar .btn{flex:1}

  /* sticky action */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--felt-deep) 38%);
    z-index:30;
  }
  .sticky .inner{max-width:560px;margin:0 auto}

  /* ---------- round sheet (modal) ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(15,28,20,.6);backdrop-filter:blur(3px);
    z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{
    width:100%;max-width:560px;background:linear-gradient(180deg,var(--naipe),#ECE1C4);
    color:var(--ink);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88dvh;overflow:auto;animation:up .32s cubic-bezier(.2,.9,.3,1.1);
    box-shadow:0 -16px 40px rgba(0,0,0,.35)}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px;margin:2px 0 2px}
  .sheet .hint{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .erow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(42,32,20,.1)}
  .erow .pip{width:30px;height:30px;flex:none}.erow .pip svg{width:24px;height:24px}
  .erow .en{flex:1;font-weight:600;font-size:15px}
  .stepper{display:flex;align-items:center;gap:6px;flex:none}
  .stepper button{width:38px;height:42px;border-radius:11px;background:rgba(42,32,20,.07);font-size:22px;font-weight:600;color:var(--ink);line-height:1}
  .stepper input{width:62px;text-align:center;padding:11px 4px;font-weight:700;font-size:18px}
  .quick{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .quick button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;background:rgba(42,32,20,.07);color:var(--ink-soft)}
  .quick button.q-zero{color:var(--basto);background:rgba(78,122,56,.13)}
  .quick button.q-ch{color:var(--oro);background:rgba(194,144,43,.14)}
  .eblock{padding:6px 0}
  .eblock .quick{margin-left:42px}

  /* ---------- winner ---------- */
  .winner{text-align:center;padding:30px 20px;animation:deal .5s ease}
  .winner .pip-big{margin:0 auto 14px;width:74px;height:74px}.winner .pip-big svg{width:52px;height:52px}
  .winner h2{font-family:"Fraunces",serif;font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px}
  .winner .wname{font-family:"Fraunces",serif;font-weight:700;font-size:38px;line-height:1.05;margin:0 0 6px}
  .winner .wscore{font-size:15px;color:var(--ink-soft);font-weight:600;margin-bottom:20px}

  .history{margin-top:18px}
  .history summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.06em;
    color:var(--cream-soft);text-align:center;padding:8px}
  .history summary::-webkit-details-marker{display:none}
  .htable{margin-top:10px;background:rgba(255,255,255,.04);border-radius:14px;padding:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;color:var(--cream)}
  th,td{padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
  th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);font-weight:700}
  tbody tr:nth-child(odd){background:rgba(255,255,255,.03)}
  td.nm{text-align:left;font-weight:600;white-space:nowrap}
  tfoot td{font-weight:800;border-top:1px solid rgba(255,255,255,.12);padding-top:9px}

  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="suits-row" id="suitsRow"></div>
      <h1>Chinchón</h1>
      <div class="sub">Tanteador</div>
    </div>
    <div id="headerAction"></div>
  </header>

  <main id="app"></main>
</div>

<div class="sticky hidden" id="sticky"><div class="inner" id="stickyInner"></div></div>
<div id="sheetHost"></div>

<script>
/* ===== palos de la baraja española ===== */
const SUITS = [
  {key:'oros',   name:'Oros',    color:'#C2902B'},
  {key:'copas',  name:'Copas',   color:'#B23A2C'},
  {key:'espadas',name:'Espadas', color:'#316487'},
  {key:'bastos', name:'Bastos',  color:'#4E7A38'},
];
function pip(i, size){
  const c = SUITS[i % 4].color;
  const s = size||24;
  const inner = {
    oros:`<circle cx="12" cy="12" r="8.3" fill="none" stroke="${c}" stroke-width="1.7"/><circle cx="12" cy="12" r="4.4" fill="${c}"/><circle cx="12" cy="12" r="1.6" fill="#F4ECD6"/>`,
    copas:`<path d="M7 5h10c0 4.3-2 6.8-4 7.6V17h2.6v1.7H8.4V17H11v-4.4C9 11.8 7 9.3 7 5Z" fill="${c}"/>`,
    espadas:`<path d="M12 2.4 9.5 9.2c-.6 1.6-.6 3 0 4.1l1.4 2.4h2.2l1.4-2.4c.6-1.1.6-2.5 0-4.1L12 2.4Z" fill="${c}"/><path d="M8.7 16.6h6.6v1.5H8.7zM11 18.4h2v3h-2z" fill="${c}"/>`,
    bastos:`<path d="M8.6 3.5c1.7-.4 3 .6 3.4 1.9.4-1.3 1.7-2.3 3.4-1.9 1.9.5 2.4 2.5 1.4 3.9-.7 1-2 1.4-3 1.1l-.3 11h-3l-.3-11c-1 .3-2.3-.1-3-1.1-1-1.4-.5-3.4 1.4-3.9Z" fill="${c}"/>`,
  }[SUITS[i%4].key];
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true">${inner}</svg>`;
}

/* ===== estado ===== */
const KEY='chinchon_v1';
let S = null;
function fresh(){ return {phase:'setup', limit:100, names:['',''], players:[]}; }

async function load(){
  try{ const v = localStorage.getItem(KEY); if(v){ S=JSON.parse(v); return; } }
  catch(e){}
  S = fresh();
}
async function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ===== helpers ===== */
const total = p => (p.base||0) + p.scores.reduce((a,b)=>a+b,0);
const rounds = () => S.players.length ? Math.max(0,...S.players.map(p=>p.scores.length)) : 0;
const isOut = p => total(p) > S.limit;
const actives = () => S.players.filter(p=>!isOut(p));
const leaderId = () => {
  const a = actives(); if(!a.length) return null;
  return a.reduce((m,p)=> total(p) < total(m) ? p : m, a[0]).id;
};

/* ===== render router ===== */
function render(){
  document.getElementById('suitsRow').innerHTML = [0,1,2,3].map(i=>pip(i,18)).join('');
  const app = document.getElementById('app');
  const sticky = document.getElementById('sticky');
  const ha = document.getElementById('headerAction');
  ha.innerHTML='';
  if(S.phase==='setup'){ renderSetup(app); sticky.classList.add('hidden'); }
  else { renderPlay(app); ha.innerHTML = `<button class="btn btn-line" style="padding:9px 13px;font-size:13px" onclick="confirmReset()">Nuevo</button>`; }
}

/* ----- SETUP ----- */
function renderSetup(app){
  const limits=[50,100,200];
  app.innerHTML = `
    <div class="panel stack">
      <div>
        <div class="label">Jugadores</div>
        <div class="player-rows" id="prows"></div>
        <button class="add-btn" onclick="addName()">+ Agregar jugador</button>
      </div>
      <div>
        <div class="label" style="margin-bottom:9px">Se elimina al superar</div>
        <div class="limit-row" id="limits">
          ${limits.map(l=>`<button class="chip ${S.limit===l?'on':''}" onclick="setLimit(${l})">${l} pts</button>`).join('')}
          <input type="number" inputmode="numeric" value="${limits.includes(S.limit)?'':S.limit}" placeholder="otro"
                 style="width:90px" oninput="setLimit(+this.value||0)">
        </div>
      </div>
    </div>
    <div style="margin-top:16px"><button class="btn btn-gold" id="startBtn" onclick="start()">Empezar partida</button></div>
    <p style="text-align:center;color:var(--cream-dim);font-size:12.5px;margin-top:16px;line-height:1.5">
      Cada jugador es una carta. Al cargar la ronda usá <b>Cerró</b> para 0 y <b>Chinchón</b> para −10.</p>
  `;
  drawNameRows();
  refreshStart();
}
function drawNameRows(){
  const host=document.getElementById('prows'); if(!host) return;
  host.innerHTML = S.names.map((n,i)=>`
    <div class="prow">
      <div class="pip">${pip(i,21)}</div>
      <input type="text" value="${escapeHtml(n)}" maxlength="14" placeholder="Jugador ${i+1}"
             oninput="S.names[${i}]=this.value;refreshStart();save()">
      ${S.names.length>2?`<button class="rm" onclick="rmName(${i})">×</button>`:''}
    </div>`).join('');
}
function refreshStart(){
  const b=document.getElementById('startBtn'); if(!b) return;
  const ok = S.names.filter(n=>n.trim()).length>=2 && S.limit>0;
  b.style.opacity = ok?1:.45; b.style.pointerEvents = ok?'auto':'none';
}
function addName(){ if(S.names.length>=8) return; S.names.push(''); drawNameRows(); refreshStart(); save(); }
function rmName(i){ if(S.names.length<=2) return; S.names.splice(i,1); drawNameRows(); refreshStart(); save(); }
function setLimit(l){ S.limit=l; document.querySelectorAll('#limits .chip').forEach((c,idx)=>c.classList.toggle('on',[50,100,200][idx]===l)); refreshStart(); save(); }

function start(){
  const clean = S.names.map(n=>n.trim()).filter(Boolean);
  if(clean.length<2) return;
  S.players = clean.map((n,i)=>({id:'p'+i+'_'+Date.now().toString(36).slice(-4)+i, name:n, suit:i%4, scores:[], base:0}));
  S.phase='play'; save(); render();
}

/* ----- PLAY ----- */
function renderPlay(app){
  const over = rounds()>0 && actives().length<=1;
  if(over){ renderWinner(app); return; }
  const lead = leaderId();
  app.innerHTML = `<div class="deal">${S.players.map((p,idx)=>card(p,idx,lead)).join('')}</div>${historyBlock()}`;
  document.getElementById('sticky').classList.remove('hidden');
  document.getElementById('stickyInner').innerHTML =
    `<button class="btn btn-gold" onclick="openRound()">Cargar ronda ${rounds()+1}</button>`;
}
function card(p,idx,lead){
  const t=total(p), out=isOut(p), pct=Math.max(0,Math.min(100, t/S.limit*100));
  const last = p.scores.length ? p.scores[p.scores.length-1] : null;
  const col = SUITS[p.suit].color;
  const meta = [];
  if(last!==null) meta.push(`última ${last>0?'+':''}${last}`);
  if(p.base) meta.push(`<span class="badge-re">♻ reenganche</span>`);
  return `
   <div class="card ${out?'out':''} ${(!out&&p.id===lead)?'lead':''}" style="animation-delay:${idx*60}ms">
     <div class="pip-big" style="background:${hexA(col,.09)}">${pip(p.suit,32)}</div>
     <div class="who">
       <div class="name">${escapeHtml(p.name)} ${(!out&&p.id===lead)?'<span class="crown">👑</span>':''}</div>
       <div class="bar"><i style="width:${pct}%;background:${out?'var(--danger)':col}"></i></div>
       <div class="meta">${meta.join(' · ')||'sin rondas'} ${out?`· <button onclick="reenganche('${p.id}')" style="color:var(--basto);font-weight:700;font-size:11.5px;text-decoration:underline">reenganchar</button>`:''}</div>
     </div>
     <div class="score" style="color:${out?'var(--danger)':'var(--ink)'}">${t}<small>de ${S.limit}</small></div>
   </div>`;
}

function reenganche(id){
  const p=S.players.find(x=>x.id===id); if(!p) return;
  const a=actives(); if(!a.length){ alert('No hay puntero para reenganchar.'); return; }
  const max=Math.max(...a.map(total));
  p.base += (max - total(p));   // vuelve al puntaje del jugador más alto en juego
  save(); render();
}

/* ----- round sheet ----- */
function openRound(){
  const act = S.players.filter(p=>!isOut(p));
  const host=document.getElementById('sheetHost');
  host.innerHTML = `
   <div class="sheet-bg" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <h2>Ronda ${rounds()+1}</h2>
      <div class="hint">Puntos que le quedaron a cada uno en la mano.</div>
      ${act.map(p=>`
        <div class="eblock">
          <div class="erow">
            <div class="pip">${pip(p.suit,24)}</div>
            <div class="en">${escapeHtml(p.name)}</div>
            <div class="stepper">
              <button onclick="bump('${p.id}',-1)">−</button>
              <input id="in_${p.id}" type="number" inputmode="numeric" value="0" onfocus="this.select()">
              <button onclick="bump('${p.id}',1)">+</button>
            </div>
          </div>
          <div class="quick">
            <button class="q-zero" onclick="setVal('${p.id}',0)">Cerró · 0</button>
            <button class="q-ch" onclick="setVal('${p.id}',-10)">Chinchón · −10</button>
            <button onclick="bump('${p.id}',10)">+10</button>
            <button onclick="bump('${p.id}',5)">+5</button>
          </div>
        </div>`).join('')}
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-ghost" style="flex:.5" onclick="closeSheet()">Cancelar</button>
        <button class="btn btn-primary" style="flex:1" onclick="commitRound()">Guardar ronda</button>
      </div>
    </div>
   </div>`;
}
function closeSheet(){ document.getElementById('sheetHost').innerHTML=''; }
function bump(id,d){ const el=document.getElementById('in_'+id); el.value=(parseInt(el.value||'0',10)+d); }
function setVal(id,v){ document.getElementById('in_'+id).value=v; }
function commitRound(){
  const act = S.players.filter(p=>!isOut(p));
  act.forEach(p=>{ const el=document.getElementById('in_'+p.id); p.scores.push(parseInt(el.value||'0',10)||0); });
  // los que ya estaban fuera no suman: igualamos largo de rondas con 0 para alinear tabla
  const r=rounds();
  S.players.forEach(p=>{ while(p.scores.length<r) p.scores.push(0); });
  closeSheet(); save(); render();
}

/* ----- undo / winner / history ----- */
function undoRound(){
  if(rounds()===0) return;
  if(!confirm('¿Borrar la última ronda cargada?')) return;
  const r=rounds();
  S.players.forEach(p=>{ if(p.scores.length===r) p.scores.pop(); });
  save(); render();
}
function renderWinner(app){
  document.getElementById('sticky').classList.add('hidden');
  const a=actives();
  const w = a.length ? a[0] : S.players.reduce((m,p)=>total(p)<total(m)?p:m, S.players[0]);
  app.innerHTML = `
    <div class="panel winner">
      <div class="pip-big" style="background:${hexA(SUITS[w.suit].color,.12)}">${pip(w.suit,52)}</div>
      <h2>Gana la partida</h2>
      <div class="wname">${escapeHtml(w.name)}</div>
      <div class="wscore">cerró con ${total(w)} puntos</div>
      <button class="btn btn-gold" onclick="confirmReset()">Jugar otra</button>
    </div>
    ${historyBlock(true)}`;
}
function historyBlock(open){
  if(rounds()===0) return '';
  const r=rounds();
  const head = `<tr><th>#</th>${S.players.map(p=>`<th>${escapeHtml(p.name.slice(0,5))}</th>`).join('')}</tr>`;
  let body='';
  for(let i=0;i<r;i++){
    body += `<tr><td>R${i+1}</td>${S.players.map(p=>{
      const v=p.scores[i]; return `<td>${v===undefined?'·':(v>0?'+':'')+v}</td>`;
    }).join('')}</tr>`;
  }
  const foot = `<tr><td>Σ</td>${S.players.map(p=>`<td style="color:${isOut(p)?'var(--danger)':'var(--gold)'}">${total(p)}</td>`).join('')}</tr>`;
  return `
   <details class="history" ${open?'open':''}>
     <summary>Ver historial de rondas ▾</summary>
     <div class="htable">
       <table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>
       <div style="text-align:center;margin-top:10px">
         <button class="btn btn-line" style="padding:9px 16px;font-size:13px;border-color:rgba(255,255,255,.25);color:var(--cream)" onclick="undoRound()">Deshacer última ronda</button>
       </div>
     </div>
   </details>`;
}
function confirmReset(){
  if(confirm('¿Empezar una partida nueva? Se borra el tanteador actual.')){
    const names = S.players.length ? S.players.map(p=>p.name) : S.names;
    S = fresh(); S.names = names.length>=2?names:['','']; S.limit=100;
    save(); render();
  }
}

/* ===== util ===== */
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function hexA(hex,a){const n=hex.replace('#','');const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}

/* ===== boot ===== */
(async()=>{ await load(); render(); })();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
